name: Test generator

'on':
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'adguard.txt'
      - 'sources.json'
      - 'metadata.json'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'adguard.txt'
      - 'sources.json'
      - 'metadata.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update.py --snapshot sources.json --check
